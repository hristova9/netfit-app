version: '3.8'

services:
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: "redis:latest"
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mynetwork

  client:
    build: ./client
    container_name: client
    restart: always
    ports:
      - "5173:5173"
    # depends_on:
      # - api-gateway
    volumes:
      - ./client:/app  
      - /app/node_modules 
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: ["npm", "run", "dev", "--", "--host"]
    networks:
      - mynetwork


  user_db:
    image: postgres:17
    container_name: user_db
    restart: always
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASS}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
    - user_db_data:/var/lib/postgresql/data
    networks:
      - mynetwork

  post_db:
    image: postgres:17
    container_name: post_db
    restart: always
    environment:
      POSTGRES_USER: ${POST_DB_USER}
      POSTGRES_PASSWORD: ${POST_DB_PASS}
      POSTGRES_DB: ${POST_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
    - post_db_data:/var/lib/postgresql/data
    networks:
      - mynetwork

  user-service:
    build: ./users-service
    container_name: user-service
    restart: always
    depends_on:
      - user_db
      - rabbitmq
      - redis
    ports:
      - "3001:3001"
    environment:
      - REDIS_HOST=redis
    env_file:
      - .env
    networks:
      - mynetwork

  post-service:
    build: ./posts-service
    container_name: post-service
    restart: always
    depends_on:
      - post_db
      - rabbitmq
    ports:
      - "3002:3002"
    env_file:
      - .env
    networks:
      - mynetwork

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - user-service
      - rabbitmq
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: ${USER_DB_PORT}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASS: ${USER_DB_PASS}
      USER_DB_NAME: ${USER_DB_NAME}
      POST_DB_HOST: ${POST_DB_HOST}
      POST_DB_PORT: ${POST_DB_PORT}
      POST_DB_USER: ${POST_DB_USER}
      POST_DB_PASS: ${POST_DB_PASS}
      POST_DB_NAME: ${POST_DB_NAME}
      RABBITMQ_URL: ${RABBITMQ_URL}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
    networks:
      - mynetwork
    
    chat_db:
      image: postgres:17
      container_name: chat_db
      restart: always
      environment:
        POSTGRES_USER: ${CHAT_DB_USER}
        POSTGRES_PASSWORD: ${CHAT_DB_PASS}
        POSTGRES_DB: ${CHAT_DB_NAME}
      ports:
        - "5435:5432"
      volumes:
        - chat_db_data:/var/lib/postgresql/data
      networks:
        - mynetwork

  chat-service:
    build: ./chat-service
    container_name: chat-service
    restart: always
    depends_on:
      - chat_db
      - rabbitmq
      - redis
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CHAT_DB_HOST=chat_db
      - CHAT_DB_PORT=5432
      - CHAT_DB_USER=${CHAT_DB_USER}
      - CHAT_DB_PASS=${CHAT_DB_PASS}
      - CHAT_DB_NAME=${CHAT_DB_NAME}
    networks:
      - mynetwork

volumes:
  user_db_data:
  post_db_data:
  redis_data:
  chat_db_data:
  
networks:
  mynetwork:
    driver: bridge